name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor: tomllib is stdlib from there, which is what lets the
        # project stay dependency-free.
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          # Host probing and the executable test stand-ins are per-platform
          # (runner/hostinfo.py, tests/executable.py). Without a Windows job
          # they regress silently, which is how they broke before.
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q

  no-runtime-dependencies:
    name: No runtime dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install without dev extras
        run: pip install -e .
      - name: Import and run on a bare interpreter
        # A dependency sneaking into an import would break the stock-interpreter
        # claim silently, so it is enforced rather than documented.
        run: |
          pip list --format=freeze | grep -v "^mcbench" | grep -v "^pip" \
            | grep -v "^setuptools" | grep -v "^wheel" > /tmp/extra.txt || true
          if [ -s /tmp/extra.txt ]; then
            echo "Unexpected runtime dependencies:"; cat /tmp/extra.txt; exit 1
          fi
          python -c "import mcbench, mcbench.cli, mcbench.stats, mcbench.inspect"
          mcbench scenarios
          mcbench metrics
          mcbench targets

  java:
    name: probe-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Test
        # No Minecraft, no network beyond Maven Central. probe-core has zero game
        # imports so this stays fast. The loader adapters are separate builds and
        # are gated in `adapters` below.
        working-directory: probe
        run: ./gradlew test --no-daemon

  adapters:
    name: Loader adapters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Paper
        # A plugin against the Paper API, which is an ordinary Maven artefact:
        # no game to download, so this is as cheap as probe-core and was never
        # gated only because it sat beside the ones that are expensive.
        working-directory: probe/adapters/probe-paper
        run: ./gradlew build --no-daemon
      - name: Fabric
        # This one does download Minecraft and remap against Yarn, which is why
        # it was left out. It is also the adapter that ships and the one whose
        # only compile-time check on a game API is this build: a renamed method
        # is not a test failure anywhere else, it is a crash in someone's
        # benchmark three hours in.
        #
        # Gradle itself must be on 21. Loom resolves Minecraft while configuring
        # the project, before the toolchain the build script declares is
        # consulted, so a Gradle on an older JVM fails with a version error that
        # names the toolchain it never reached.
        working-directory: probe/adapters/probe-fabric
        run: ./gradlew build --no-daemon

  agent:
    name: JVM agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build and test
        # Gateable where the loader adapters are not: the agent compiles against
        # ASM and probe-core only, so there is no Minecraft to download. `test`
        # depends on `shadowJar`, and the integration test forks a real JVM with
        # -javaagent, which is the only thing that catches the classloader-split
        # failure that unit tests all passed through.
        working-directory: probe/adapters/probe-agent
        run: ./gradlew test --no-daemon

  cross-implementation:
    name: Wire protocol conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the probe
        working-directory: probe
        run: ./gradlew jar --no-daemon
      - name: Regenerate fixtures from the real Java writer
        run: |
          java -cp probe/probe-core/build/libs/probe-core-0.1.0.jar \
            dev.mcbench.probe.core.SelfTest /tmp/conf client 42
          java -cp probe/probe-core/build/libs/probe-core-0.1.0.jar \
            dev.mcbench.probe.core.SelfTest /tmp/confs server 7
          cp /tmp/conf/probe.jsonl tests/fixtures/probe-client-reference.jsonl
          cp /tmp/confs/probe.jsonl tests/fixtures/probe-server-reference.jsonl
      - name: Parse them with the Python reader
        # The protocol has two independent implementations and will drift unless
        # something checks. Regenerating rather than reusing the committed
        # fixtures tests today's Java against today's Python.
        run: |
          pip install -e ".[dev]"
          pytest tests/test_conformance.py -q

  security:
    name: Security regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run security tests
        # Every case here is a vulnerability that was actually present. They are
        # split out so a failure is unmistakable in the checks list.
        run: pytest tests/test_security.py -q

  licence-compliance:
    name: Licence compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No game files, mod jars, or world saves committed
        # docs/LICENSING.md: Minecraft and mod jars may never be redistributed.
        # The only jar permitted in the tree is the Gradle wrapper.
        run: |
          offenders=$(git ls-files '*.jar' | grep -v 'gradle-wrapper.jar' || true)
          if [ -n "$offenders" ]; then
            echo "Jars committed that are not the Gradle wrapper:"
            echo "$offenders"; exit 1
          fi
          saves=$(git ls-files '*.mca' '*.mcr' 'level.dat' || true)
          if [ -n "$saves" ]; then
            echo "World save data committed:"; echo "$saves"; exit 1
          fi
