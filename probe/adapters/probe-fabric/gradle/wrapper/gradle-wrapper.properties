# Pinned to 8.10 deliberately. Fabric Loom 1.7.x calls Gradle's
# Problems.forNamespace, which was removed in Gradle 8.13, so the adapter cannot
# use the same Gradle as probe-core. Keeping the adapter a separate build is what
# makes that difference harmless.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.10-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
