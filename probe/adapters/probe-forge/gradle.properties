# Retargeting a Minecraft version is normally these lines and nothing else; the
# version-coupled surface is three methods (docs/PLATFORMS.md).
#
# 1.21.1 deliberately matches the Fabric and NeoForge adapters. Three loaders on
# one Minecraft version is what makes a cross-loader comparison meaningful: any
# difference measured is the loader, not the game.
minecraft_version=1.21.1
forge_version=52.1.16
forgegradle_version=6.0.54

org.gradle.jvmargs=-Xmx3G
