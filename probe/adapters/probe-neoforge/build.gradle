plugins {
    id 'java'
    id 'net.neoforged.moddev' version "${moddev_version}"
}

group = 'dev.mcbench'
version = '0.1.0'
base { archivesName = 'mcbench-probe-neoforge' }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

neoForge {
    version = project.neoforge_version
}

repositories {
    mavenCentral()
}

dependencies {
    // Bundled via jarJar so the adapter ships as one artefact; probe-core has no
    // dependencies of its own, so nothing else comes with it.
    implementation 'dev.mcbench:probe-core:0.1.0'
    jarJar('dev.mcbench:probe-core:0.1.0') { version { strictly '0.1.0' } }
}

tasks.withType(JavaCompile).configureEach { options.release = 21 }

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}
