// Standalone build, like every adapter: ModDevGradle downloads and remaps
// Minecraft, and probe-core's offline one-second test run is worth protecting
// from that. See ../../../docs/PLATFORMS.md.
pluginManagement {
    repositories {
        maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
        gradlePluginPortal()
    }
}

rootProject.name = 'mcbench-probe-neoforge'

includeBuild('../..') {
    dependencySubstitution {
        substitute module('dev.mcbench:probe-core') using project(':probe-core')
    }
}
