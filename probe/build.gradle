subprojects {
    group = 'dev.mcbench'
    version = '0.1.0'

    repositories {
        mavenCentral()
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
    }

    plugins.withType(JavaPlugin).configureEach {
        java {
            toolchain { languageVersion = JavaLanguageVersion.of(21) }
        }
        tasks.withType(Test).configureEach { useJUnitPlatform() }
    }
}
