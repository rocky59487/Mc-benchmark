[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcbench"
version = "0.1.0"
description = "Controlled, reproducible performance benchmarking for Minecraft mods"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["minecraft", "benchmark", "performance", "mods"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Topic :: Games/Entertainment",
    "Topic :: System :: Benchmark",
]

# No runtime dependencies, so anyone can verify a published result with a stock
# interpreter. The statistics involved (bootstrap, MAD, Cliff's delta) are a few
# dozen lines each, and tomllib is stdlib on 3.11+. CI enforces this.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
mcbench = "mcbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
# 100 rather than 88: many lines here are single CSS rules, coordinate-format
# ternaries, or dict literals in tests, which read worse folded.
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    # `class X(str, Enum)` rather than `StrEnum`. These enums are serialised
    # into JSON results and read back by third parties; StrEnum changes what
    # str() returns, which would alter already-published report text.
    "UP042",
]
