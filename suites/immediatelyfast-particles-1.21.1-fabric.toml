# Does ImmediatelyFast do what it says, on the work it says it does?
#
# Of the four mods in optimisation-client-1.21.1-fabric.toml, this is the only
# one that publishes a figure: entity rendering "around 2x higher" on busy
# servers, maps "around 5x", HUD "around 40% higher in almost all scenarios",
# text "around 2x", block entities "around 20%".
#
# That suite measures none of them. Both of its scenarios fly a camera over
# empty pre-generated terrain in creative mode, so there are no entities, no
# maps, no signs, no block entities, and a HUD of a hotbar and a crosshair. It
# reports about 3% and the mod's own page predicts as much: "small improvements
# when using high-end GPUs or very fast CPUs".
#
# What the mod optimises is immediate-mode rendering, and particles are the
# purest immediate-mode workload the game has. visual-particle-storm sustains
# seven emitters at fixed rates, so it asks the question that suite could not.
#
# Two variants, because the question is about one mod. Six runs per cell rather
# than five: even, so the position balance is exact, and one above the
# admissibility floor so a single outlying run does not cost the cell its
# verdict.

name = "ImmediatelyFast on immediate-mode work, 1.21.1 Fabric"
minecraft_version = "1.21.1"
loader = "fabric"
loader_version = "0.19.3"

scenarios = ["visual-particle-storm"]

baseline = "vanilla"
runs_per_cell = 6
preset = "quick"
order = "interleaved"
rope = 0.02
seed = 20260804
heap_mb = 6144

[[variants]]
name = "vanilla"
mods = []

[[variants]]
name = "immediatelyfast"
mods = ["modrinth:immediatelyfast@1.6.11+1.21.1-fabric"]
